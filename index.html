    <!-- Critical CSS to prevent CLS and improve FCP -->
    <style>
      /* Reserve space for fonts to prevent layout shift */
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; }
      h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Prevent hero CLS by setting min-height */
      #root > div > section:first-child { min-height: 100vh; min-height: 100dvh; position: relative; }
      /* Critical hero styles */
      .bg-white { background-color: #fff; }
      .absolute { position: absolute; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .relative { position: relative; }
      .overflow-hidden { overflow: hidden; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .object-cover { object-fit: cover; }
      /* Initial loading state - Loading screen */
      #root:empty::before { content: ''; display: block; height: 100vh; background: #f97316; }
      
      /* Loading screen styles */
      .loading-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 2rem;
        animation: pulse 2s ease-in-out infinite;
      }
      .loading-text {

        font-size: 1.5rem;
        font-weight: 600;
        text-align: center;
        font-family: 'Montserrat', sans-serif;
        margin-bottom: 1rem;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
